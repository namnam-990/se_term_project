[project]
name = "lsrs"
version = "0.1.0"
description = "도서관 좌석 예약 시스템 (5조)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["B008"]  # FastAPI Depends() 기본값 패턴 허용

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: MySQL이 필요한 통합 테스트 (pytest -m 'not integration' 으로 제외)",
]
