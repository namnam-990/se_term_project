{% extends "base.html" %}
{% block title %}좌석 현황{% endblock %}
{% block content %}
<h1>좌석 현황</h1>
<form id="seat-filters" class="filters">
  <label>날짜 <input name="date" type="date" required></label>
  <!-- 운영 시간·단위는 정책(GET /api/policies/current)에서 읽어 옵션을 만든다 (D-11) -->
  <fieldset class="time-pick">
    <legend>시작 시간</legend>
    <select name="start_hour" aria-label="시작 시" required><option value="">--</option></select>
    <span>시</span>
    <select name="start_minute" aria-label="시작 분" required><option value="">--</option></select>
    <span>분</span>
  </fieldset>
  <fieldset class="time-pick">
    <legend>종료 시간</legend>
    <select name="end_hour" aria-label="종료 시" required><option value="">--</option></select>
    <span>시</span>
    <select name="end_minute" aria-label="종료 분" required><option value="">--</option></select>
    <span>분</span>
  </fieldset>
  <button class="btn" type="submit">조회</button>
</form>
<p id="seat-policy" class="muted" hidden></p>
<ul class="seat-legend" aria-label="좌석 상태 범례">
  <li class="seat AVAILABLE">예약 가능</li>
  <li class="seat IN_USE">사용 중</li>
  <li class="seat MINE">내 예약</li>
  <li class="seat RESERVED">예약됨</li>
</ul>
<p id="seat-message" class="seat-message" role="status">날짜와 시간을 선택하면 좌석 현황이 표시됩니다.</p>
<!-- US-05: '예약 가능' 좌석을 누르면 열리는 확인 패널 -->
<section id="reserve-panel" class="reserve-panel" hidden aria-live="polite">
  <p id="reserve-summary"></p>
  <button id="reserve-confirm" class="btn" type="button">예약하기</button>
  <button id="reserve-close" class="btn secondary" type="button">닫기</button>
</section>
<div class="scroll-region">
  <div id="seat-grid" class="seat-grid" aria-label="좌석 배치"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', path='js/seat-grid.js') }}"></script>
{% endblock %}
