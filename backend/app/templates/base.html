<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LSRS{% endblock %} · 도서관 좌석 예약</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">LSRS</a>
    <nav>
      <a href="/seats">좌석 조회</a>
      <a href="/me/reservations">내 예약</a>
      <a href="/login" id="nav-login">로그인</a>
      <button id="nav-logout" class="link" hidden>로그아웃</button>
    </nav>
  </header>
  <main class="container">
    <div id="toast" class="toast" hidden></div>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='js/api.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
