{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<h1>로그인</h1>
<form id="login-form" class="filters auth-form">
  <label>학번 또는 관리자 ID <input name="login_id" autocomplete="username" required></label>
  <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn" type="submit">로그인</button>
</form>
<p id="auth-message" role="status"></p>
<a id="verify-link" href="/verify-email" hidden>이메일 인증하기</a>
<p>처음 이용하나요? <a href="/signup">회원가입</a></p>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='js/auth.js') }}"></script>{% endblock %}
